<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luminance Segmentation Tool</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
        header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:space-between;padding:15px 30px}
        header h1{font-size:1.8rem;font-weight:400;color:#333}
        #clearBtn{background:#e74c3c;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:14px}
        #clearBtn:hover{background:#c0392b}
        #dropZone{flex:1;display:flex;align-items:center;justify-content:center;border:3px dashed #ccc;border-radius:10px;margin:30px;background:#fff}
        #dropZone.hidden{display:none}
        #imageArea{flex:1;display:flex;align-items:center;justify-content:center;background:#f5f5f5;padding:20px}
        #mainCanvas{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
        #bottomBar{background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.1);display:flex;min-height:280px}
        #controls,#histogram{flex:1;padding:20px;overflow-y:auto}
        #controls{border-right:1px solid #e0e0e0}
        #controls h2,#histogram h2{font-size:1.1rem;margin-bottom:15px;color:#333}
        .segment-config{display:flex;align-items:center;gap:15px;margin-bottom:15px}
        .segment-config label{font-size:14px;color:#555}
        select{padding:4px 8px;border:1px solid #ccc;border-radius:4px}
        .toggle-wrap{display:flex;gap:15px;margin-bottom:15px}
        .toggle-btn{padding:4px 12px;border:1px solid #007bff;border-radius:4px;background:#fff;color:#007bff;cursor:pointer;font-size:14px}
        .toggle-btn.active{background:#007bff;color:#fff}
        .sliders-container{display:flex;flex-direction:column;gap:8px}
        .slider-group{display:flex;align-items:center;gap:10px}
        .slider-group label{min-width:70px;font-size:13px}
        input[type=range]{flex:1}
        .value-display{font-size:13px;font-weight:bold;color:#007bff}
        #histogramCanvas{width:100%;height:200px}
        .hidden{display:none!important}
    </style>
</head>
<body>
    <header>
        <h1>Luminance Segmentation Tool</h1>
        <button id="clearBtn" class="hidden">Clear</button>
    </header>

    <!-- drop zone -->
    <div id="dropZone">
        <p>Drag & Drop an image here or click to select</p>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <!-- image display -->
    <div id="imageArea" class="hidden">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- bottom controls + histogram -->
    <div id="bottomBar" class="hidden">
        <div id="controls">
            <h2>Controls</h2>
            <div class="segment-config">
                <label>Segments (2-10):</label>
                <select id="segmentCount">
                    <option>2</option><option>3</option><option>4</option>
                    <option selected>5</option><option>6</option><option>7</option>
                    <option>8</option><option>9</option><option>10</option>
                </select>
            </div>
            <div class="toggle-wrap">
                <button id="modeToggle" class="toggle-btn active">Manual</button>
                <button id="viewToggle" class="toggle-btn active">Segmented</button>
            </div>
            <div class="sliders-container" id="slidersContainer"></div>
        </div>
        <div id="histogram">
            <h2>Luminance Histogram</h2>
            <canvas id="histogramCanvas"></canvas>
        </div>
    </div>

    <script>
        let originalImage=null, originalPixels=null, segmentValues=[], luminanceData=null;
        let manualMode=true, segmentedView=true;

        const dropZone=document.getElementById('dropZone'),
              fileInput=document.getElementById('fileInput'),
              clearBtn=document.getElementById('clearBtn'),
              mainCanvas=document.getElementById('mainCanvas'),
              segmentCountSelect=document.getElementById('segmentCount'),
              slidersContainer=document.getElementById('slidersContainer'),
              modeToggle=document.getElementById('modeToggle'),
              viewToggle=document.getElementById('viewToggle'),
              histCtx=document.getElementById('histogramCanvas').getContext('2d');
        const ctx=mainCanvas.getContext('2d');

        // ---- global events ----
        ['dragover','dragleave','drop'].forEach(evt=>{
            dropZone.addEventListener(evt,e=>{
                e.preventDefault();
                dropZone.classList.toggle('drag-over',evt==='dragover');
                if(evt==='drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
            })
        });
        dropZone.addEventListener('click',()=>fileInput.click());
        fileInput.addEventListener('change',e=>handleFile(e.target.files[0]));
        segmentCountSelect.addEventListener('change',updateSegments);
        modeToggle.addEventListener('click',toggleMode);
        viewToggle.addEventListener('click',toggleView);
        clearBtn.addEventListener('click',resetPage);

        function resetPage(){
            location.reload();
        }

        function handleFile(file){
            if(!file.type.startsWith('image/')) return;
            const reader=new FileReader();
            reader.onload=e=>{
                const img=new Image();
                img.onload=()=>{ originalImage=img; loadImage(); };
                img.src=e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function loadImage(){
            mainCanvas.width=originalImage.width;
            mainCanvas.height=originalImage.height;
            const maxW=Math.min(window.innerWidth-60, originalImage.width);
            const scale=maxW/originalImage.width;
            mainCanvas.style.maxWidth='100%';
            mainCanvas.style.maxHeight='calc(100vh - 340px)';
            mainCanvas.width*=scale;
            mainCanvas.height*=scale;

            ctx.drawImage(originalImage,0,0,mainCanvas.width,mainCanvas.height);
            const imgData=ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height);
            originalPixels=new Uint8ClampedArray(imgData.data);
            luminanceData=new Float32Array(mainCanvas.width*mainCanvas.height);
            for(let i=0;i<originalPixels.length;i+=4){
                const [r,g,b]=originalPixels.slice(i,i+3);
                luminanceData[i/4]=0.299*r+0.587*g+0.114*b;
            }
            dropZone.classList.add('hidden');
            document.getElementById('imageArea').classList.remove('hidden');
            document.getElementById('bottomBar').classList.remove('hidden');
            clearBtn.classList.remove('hidden');
            updateSegments();
        }

        function updateSegments(){
            const k=+segmentCountSelect.value;
            if(manualMode){
                segmentValues=[...Array(k)].map((_,i)=>Math.round((i+1)*(255/(k+1))));
                buildSliders();
            }else{
                runKMeans(k);
            }
            updateCanvas();
            drawHistogram();
        }

        function toggleMode(){
            manualMode=!manualMode;
            modeToggle.textContent=manualMode?'Manual':'K-Means';
            slidersContainer.style.display=manualMode?'flex':'none';
            updateSegments();
        }

        function toggleView(){
            segmentedView=!segmentedView;
            viewToggle.textContent=segmentedView?'Segmented':'Original';
            updateCanvas();
        }

        // ---- K-Means ----
        function runKMeans(k){
            const data=luminanceData;
            let centroids=[...Array(k)].map((_,i)=>{
                const idx=Math.floor(i*data.length/k+data.length/k/2);
                return data[idx];
            });
            let assignment=new Uint16Array(data.length);
            let changed=true,iter=0,maxIter=30;
            while(changed && iter++<maxIter){
                changed=false;
                for(let i=0;i<data.length;i++){
                    let min=Infinity,idx=0;
                    for(let c=0;c<k;c++){
                        const d=Math.abs(data[i]-centroids[c]);
                        if(d<min){ min=d; idx=c; }
                    }
                    if(assignment[i]!==idx){ changed=true; assignment[i]=idx; }
                }
                const sums=new Array(k).fill(0), counts=new Array(k).fill(0);
                for(let i=0;i<data.length;i++){
                    sums[assignment[i]]+=data[i];
                    counts[assignment[i]]++;
                }
                centroids=centroids.map((_,i)=>counts[i]?Math.round(sums[i]/counts[i]):centroids[i]);
            }
            segmentValues=centroids.sort((a,b)=>a-b);
        }

        // ---- manual sliders ----
        function buildSliders(){
            slidersContainer.innerHTML='';
            segmentValues.forEach((v,i)=>{
                const g=document.createElement('div'); g.className='slider-group';
                g.innerHTML=`
                    <label>Seg ${i+1}</label>
                    <input type="range" min="0" max="255" value="${v}">
                    <span class="value-display">${v}</span>`;
                g.querySelector('input').addEventListener('input',e=>{
                    segmentValues[i]=+e.target.value;
                    g.querySelector('span').textContent=e.target.value;
                    updateCanvas();
                    drawHistogram();
                });
                slidersContainer.appendChild(g);
            });
        }

        // ---- render canvas ----
        function updateCanvas(){
            if(!originalPixels) return;
            if(!segmentedView){
                const imgData=ctx.createImageData(mainCanvas.width,mainCanvas.height);
                imgData.data.set(originalPixels);
                ctx.putImageData(imgData,0,0);
                return;
            }
            const sorted=[...segmentValues].sort((a,b)=>a-b);
            const imgData=ctx.createImageData(mainCanvas.width,mainCanvas.height);
            for(let i=0;i<originalPixels.length;i+=4){
                const lum=luminanceData[i/4];
                let closest=sorted[0],min=Math.abs(lum-closest);
                for(const s of sorted){ const d=Math.abs(lum-s); if(d<min){ min=d; closest=s; } }
                imgData.data.set([closest,closest,closest,originalPixels[i+3]],i);
            }
            ctx.putImageData(imgData,0,0);
        }

        // ---- histogram ----
        function drawHistogram(){
            if(!luminanceData) return;
            const w=histCtx.canvas.width=histCtx.canvas.parentElement.clientWidth-40;
            const h=histCtx.canvas.height=200;
            histCtx.clearRect(0,0,w,h);
            const hist=Array(256).fill(0);
            luminanceData.forEach(l=>hist[Math.round(l)]++);
            const max=Math.max(...hist), barW=w/256;
            histCtx.fillStyle='#e0e0e0';
            hist.forEach((v,i)=>histCtx.fillRect(i*barW,h-10-(v/max*(h-20)),barW-1,(v/max*(h-20))));
            histCtx.strokeStyle='#007bff'; histCtx.lineWidth=2;
            histCtx.beginPath();
            segmentValues.forEach(v=>{ const x=v/255*w; histCtx.moveTo(x,0); histCtx.lineTo(x,h); });
            histCtx.stroke();
            histCtx.fillStyle='#007bff'; histCtx.font='12px Arial';
            segmentValues.forEach(v=>histCtx.fillText(v.toString(),v/255*w-10,15));
        }
    </script>
</body>
</html>
