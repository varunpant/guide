<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luminance Segmentation Tool (K-Means & Manual)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 2.5em; font-weight: 300; }
        .drop-zone { border: 3px dashed #ccc; border-radius: 10px; padding: 60px; text-align: center; background: white; transition: all .3s; margin-bottom: 30px; cursor: pointer; }
        .drop-zone:hover { border-color: #007bff; background: #f8f9fa; }
        .drop-zone.drag-over { border-color: #007bff; background: #e3f2fd; transform: scale(1.02); }
        .controls { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); margin-bottom: 30px; }
        .controls-row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
        .segment-config label, .toggle-wrap label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        select { padding: 8px 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .toggle-btn { padding: 8px 20px; border: 1px solid #007bff; border-radius: 5px; background: #007bff; color: #fff; font-size: 16px; cursor: pointer; transition: .3s; }
        .toggle-btn:hover { background: #0056b3; }
        .toggle-btn.active { background: #fff; color: #007bff; }
        .sliders-container { display: grid; gap: 15px; margin-top: 20px; }
        .slider-group { display: flex; align-items: center; gap: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .slider-group label { min-width: 120px; margin: 0; font-size: 14px; }
        input[type=range] { flex: 1; height: 6px; background: #ddd; border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #007bff; border-radius: 50%; cursor: pointer; transition: .3s; }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); box-shadow: 0 0 10px rgba(0,123,255,.5); }
        .value-display { min-width: 40px; text-align: center; font-weight: bold; color: #007bff; }
        .canvas-wrapper { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); text-align: center; }
        .canvas-wrapper h3 { margin-bottom: 15px; color: #333; font-weight: 400; }
        canvas { max-width: 100%; height: auto; border: 1px solid #e0e0e0; border-radius: 5px; }
        .histogram { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); margin-top: 30px; }
        .histogram h3 { text-align: center; margin-bottom: 15px; color: #333; font-weight: 400; }
        #histogramCanvas { width: 100%; height: 200px; border: 1px solid #e0e0e0; border-radius: 5px; }
        .hidden { display: none; }
        @media(max-width:600px){ .controls-row{flex-direction:column;align-items:stretch} }
    </style>
</head>
<body>
    <div class="container">
        <h1>Luminance Segmentation Tool</h1>

        <div class="drop-zone" id="dropZone">
            <p>Drag & Drop an image here or click to select</p>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
        </div>

        <div class="controls hidden" id="controls">
            <div class="controls-row">
                <div class="segment-config">
                    <label for="segmentCount">Segments (2–10):</label>
                    <select id="segmentCount">
                        <option>2</option><option>3</option><option>4</option>
                        <option selected>5</option><option>6</option><option>7</option>
                        <option>8</option><option>9</option><option>10</option>
                    </select>
                </div>
                <div class="toggle-wrap">
                    <label>Mode:</label>
                    <button id="modeToggle" class="toggle-btn active">Manual</button>
                </div>
                <div class="toggle-wrap">
                    <label>View:</label>
                    <button id="viewToggle" class="toggle-btn">Segmented</button>
                </div>
            </div>
            <div class="sliders-container" id="slidersContainer"></div>
        </div>

        <div class="canvas-wrapper hidden" id="canvasWrap">
            <h3 id="canvasTitle">Segmented Image</h3>
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="histogram hidden" id="histogramSection">
            <h3>Luminance Histogram</h3>
            <canvas id="histogramCanvas"></canvas>
        </div>
    </div>

    <script>
        let originalImage=null, originalPixels=null, segmentValues=[], luminanceData=null;
        let manualMode=true, segmentedView=true;

        const dropZone=document.getElementById('dropZone'),
              fileInput=document.getElementById('fileInput'),
              mainCanvas=document.getElementById('mainCanvas'),
              segmentCountSelect=document.getElementById('segmentCount'),
              slidersContainer=document.getElementById('slidersContainer'),
              modeToggle=document.getElementById('modeToggle'),
              viewToggle=document.getElementById('viewToggle'),
              canvasTitle=document.getElementById('canvasTitle');
        const ctx=mainCanvas.getContext('2d'), histCtx=document.getElementById('histogramCanvas').getContext('2d');

        // ---- basic UI wiring ----
        ['dragover','dragleave','drop','click'].forEach(evt=>{
            dropZone.addEventListener(evt, e=>{
                if(evt==='dragover'||evt==='drop') e.preventDefault();
                if(evt==='dragover') dropZone.classList.add('drag-over');
                if(evt==='dragleave') dropZone.classList.remove('drag-over');
                if(evt==='drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
                if(evt==='click') fileInput.click();
            });
        });
        fileInput.addEventListener('change',e=>handleFile(e.target.files[0]));
        segmentCountSelect.addEventListener('change',updateSegmentCount);
        modeToggle.addEventListener('click',toggleMode);
        viewToggle.addEventListener('click',toggleView);

        function handleFile(file){
            if(!file.type.startsWith('image/')) return;
            const reader=new FileReader();
            reader.onload=e=>{
                const img=new Image();
                img.onload=()=>{ originalImage=img; processImage(); };
                img.src=e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processImage(){
            const maxW=600, scale=Math.min(maxW/originalImage.width,1);
            mainCanvas.width=originalImage.width*scale;
            mainCanvas.height=originalImage.height*scale;
            ctx.drawImage(originalImage,0,0,mainCanvas.width,mainCanvas.height);
            const imgData=ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height);
            originalPixels=new Uint8ClampedArray(imgData.data);
            luminanceData=new Float32Array(mainCanvas.width*mainCanvas.height);
            for(let i=0;i<originalPixels.length;i+=4){
                const [r,g,b]=originalPixels.slice(i,i+3);
                luminanceData[i/4]=0.299*r+0.587*g+0.114*b;
            }
            updateSegmentCount();
            ['controls','canvasWrap','histogramSection'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
        }

        function updateSegmentCount(){
            const count=+segmentCountSelect.value;
            if(manualMode){
                segmentValues=[...Array(count)].map((_,i)=>Math.round((i+1)*(255/(count+1))));
                createSliders();
            }else{
                runKMeans(count);
            }
            updateCanvas();
            drawHistogram();
        }

        function toggleMode(){
            manualMode=!manualMode;
            modeToggle.textContent=manualMode?'Manual':'K-Means';
            modeToggle.classList.toggle('active',!manualMode);
            slidersContainer.style.display=manualMode?'grid':'none';
            updateSegmentCount();
        }

        function toggleView(){
            segmentedView=!segmentedView;
            viewToggle.textContent=segmentedView?'Segmented':'Original';
            viewToggle.classList.toggle('active',!segmentedView);
            updateCanvasTitles();
            updateCanvas();
        }

        function updateCanvasTitles(){
            canvasTitle.textContent=segmentedView?(manualMode?'Segmented (Manual)':'Segmented (K-Means)'):'Original Image';
        }

        // ---- K-Means on luminance ----
        function runKMeans(k){
            const data=luminanceData;
            // 1. init centroids by quantiles
            const sorted=[...data].sort((a,b)=>a-b);
            const step=sorted.length/k;
            let centroids=[...Array(k)].map((_,i)=>sorted[Math.floor(i*step+step/2)]);

            let assignment=new Uint16Array(data.length);
            let changed=true, iter=0, maxIter=50;

            while(changed && iter++<maxIter){
                changed=false;
                // assign each pixel
                for(let i=0;i<data.length;i++){
                    let minDist=Infinity, idx=0;
                    for(let c=0;c<k;c++){
                        const d=Math.abs(data[i]-centroids[c]);
                        if(d<minDist){ minDist=d; idx=c; }
                    }
                    if(assignment[i]!==idx){ changed=true; assignment[i]=idx; }
                }
                // recompute centroids
                const sums=new Array(k).fill(0), counts=new Array(k).fill(0);
                for(let i=0;i<data.length;i++){
                    sums[assignment[i]]+=data[i];
                    counts[assignment[i]]++;
                }
                centroids=centroids.map((_,i)=>counts[i]?Math.round(sums[i]/counts[i]):centroids[i]);
            }
            segmentValues=centroids.sort((a,b)=>a-b);
        }

        // ---- sliders for manual mode ----
        function createSliders(){
            slidersContainer.innerHTML='';
            segmentValues.forEach((v,i)=>{
                const g=document.createElement('div'); g.className='slider-group';
                g.innerHTML=`
                    <label>Segment ${i+1}:</label>
                    <input type="range" min="0" max="255" value="${v}">
                    <span class="value-display">${v}</span>`;
                g.querySelector('input').addEventListener('input',e=>{
                    segmentValues[i]=+e.target.value;
                    g.querySelector('span').textContent=e.target.value;
                    updateCanvas();
                    drawHistogram();
                });
                slidersContainer.appendChild(g);
            });
        }

        // ---- render canvas ----
        function updateCanvas(){
            if(!originalPixels) return;
            if(!segmentedView){
                const imgData=ctx.createImageData(mainCanvas.width,mainCanvas.height);
                imgData.data.set(originalPixels);
                ctx.putImageData(imgData,0,0);
                return;
            }
            const sorted=[...segmentValues].sort((a,b)=>a-b);
            const imgData=ctx.createImageData(mainCanvas.width,mainCanvas.height);
            for(let i=0;i<originalPixels.length;i+=4){
                const lum=luminanceData[i/4];
                let closest=sorted[0], min=Math.abs(lum-closest);
                for(const s of sorted){ const d=Math.abs(lum-s); if(d<min){ min=d; closest=s; } }
                imgData.data.set([closest,closest,closest,originalPixels[i+3]],i);
            }
            ctx.putImageData(imgData,0,0);
        }

        // ---- histogram ----
        function drawHistogram(){
            if(!luminanceData) return;
            const w=histCtx.canvas.width=histCtx.canvas.offsetWidth, h=histCtx.canvas.height=200;
            histCtx.clearRect(0,0,w,h);
            const hist=Array(256).fill(0);
            luminanceData.forEach(l=>hist[Math.round(l)]++);
            const max=Math.max(...hist), barW=w/256;
            histCtx.fillStyle='#e0e0e0';
            hist.forEach((v,i)=>histCtx.fillRect(i*barW,h-10-(v/max*(h-20)),barW-1,(v/max*(h-20))));
            histCtx.strokeStyle='#007bff'; histCtx.lineWidth=2;
            histCtx.beginPath();
            segmentValues.forEach(v=>{ const x=v/255*w; histCtx.moveTo(x,0); histCtx.lineTo(x,h); });
            histCtx.stroke();
            histCtx.fillStyle='#007bff'; histCtx.font='12px Arial';
            segmentValues.forEach(v=>histCtx.fillText(v.toString(),v/255*w-10,15));
        }
    </script>
</body>
</html>
