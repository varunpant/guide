<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #drop-area {
            border: 2px dashed #ccc;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        #controls {
            border: 1px solid #ccc;
            width: 600px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 50px auto;
            position: relative;
        }

        #drop-area.highlight {
            border-color: purple;
        }

        

        .canvas {
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
        }

        .output_canvas {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            -moz-transform: rotateY(180deg);
        }

        button {
            border: 1px solid #ccc;
            margin: 0 5px;
            background-color: lightBlue;
            height: 50px;
            width: 50px;
            cursor: pointer;
        }
    </style>
    <title>Drag and Drop Image</title>
</head>

<body>
    <div id="drop-area">
        
        <img id="display-image" src="front.jpg" alt="Your Image Here">
    </div>
    <div id="controls">
        <button id="clear">clear</button>
        <button id="grid">grid</button>
        <button id="eyes">eyes</button>
        <button id="nose">nose</button>
        <button id="lips">lips</button>
        <button id="marks">marks</button>
        <button id="lines">lines</button>
        <button id="toggle-image">toggle</button>

    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const displayImage = document.getElementById('display-image');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop area when item is dragged over it
        dropArea.addEventListener('dragenter', () => dropArea.classList.add('highlight'));
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('highlight'));

        // Handle dropped files
        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;

            handleFiles(files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                displayImage.src = URL.createObjectURL(file);
            }
        }
    </script>

    <script type="module">

        const FACE_VERTICAL = [10,151,9,8,168,6,197,195,5,4,1,19,164,0,11,12,13,14,15,16,17,18,200,199,175,152];
        const EYES_HORIZONTAL = [127,34,143,35,226,130,33,468,469,155,243,244,245,122,6,351,465,464,463,476,473,474,263,359,446,265,372,356];
        
        const NOSE_BASE = [203,98,97,2,328,327,423];
        const LIP_BASE = [57,61,76,62,78,95,88,178,87,14,317,402,318,324,308, 292,291,287];

         const NOSE_B = [64,94,294,275,45,64];
         const NOSE_BV = [275,370,141,45];
         const NOSE_O = [64,244, 193 ,417, 464, 294];
         const NOSE_OV = [193,45,275,417];



        function toFP(arr){
            var fp = [];
            for(var i=0;i<arr.length-1;i++){
                fp[i] = {"start":arr[i],"end":arr[i+1]};
            }
            return fp;
        }

        import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
        const { FaceLandmarker, FilesetResolver, DrawingUtils } = vision;
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let lastMaskType = "grid";
        let runningMode = "IMAGE";
        let faceLandmarker;
        const loading = document.getElementById("loading");
        async function createFaceLandmarker() {
            const filesetResolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                outputFaceBlendshapes: false,
                runningMode,
                numFaces: 1
            });
            loading.classList.remove("visible");
        }
        createFaceLandmarker();

        async function drawMask(event) {
            if (!faceLandmarker) {
                console.log("Wait for faceLandmarker to load before clicking!");
                return;
            }
            const target = document.getElementById("display-image");
            target.style.display = 'none';
            // Remove all landmarks drawed before
            const allCanvas = target.parentNode.getElementsByClassName("canvas");
            for (var i = allCanvas.length - 1; i >= 0; i--) {
                const n = allCanvas[i];
                n.parentNode.removeChild(n);
            }

            const faceLandmarkerResult = faceLandmarker.detect(target);
            
            const dropArea = document.getElementById('drop-area');
            const canvasWidth = dropArea.clientWidth;
            const canvasHeight = dropArea.clientHeight;

            const canvas = document.createElement("canvas");
            canvas.setAttribute("class", "canvas");
            canvas.setAttribute("width", canvasWidth + "px");
            canvas.setAttribute("height", canvasHeight + "px");
            canvas.style.left = "0px";
            canvas.style.top = "0px";
            canvas.style.width = `${canvasWidth}px`;
            canvas.style.height = `${canvasHeight}px`;
            target.parentNode.appendChild(canvas);
            const ctx = canvas.getContext("2d");
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            const imageWidth = target.naturalWidth;
            const imageHeight = target.naturalHeight;
            const aspectRatio = imageWidth / imageHeight;
            let drawWidth = canvasWidth;
            let drawHeight = canvasWidth / aspectRatio;
            if (drawHeight > canvasHeight) {
                drawHeight = canvasHeight;
                drawWidth = drawHeight * aspectRatio;
            }
            const x = (canvasWidth - drawWidth) / 2;
            const y = (canvasHeight - drawHeight) / 2;
            ctx.drawImage(target, x, y, drawWidth, drawHeight);

            const drawingUtils = new DrawingUtils(ctx);

            var mask_type = event.currentTarget.id;
            lastMaskType = mask_type;
            for (const landmarks of faceLandmarkerResult.faceLandmarks) {
                const scaledLandmarks = landmarks.map(landmark => {
                    return {
                        x: (x + landmark.x * drawWidth) / canvasWidth,
                        y: (y + landmark.y * drawHeight) / canvasHeight,
                        z: landmark.z
                    }
                });

                switch (mask_type) {
                    case "grid":
                        drawingUtils.drawConnectors(scaledLandmarks, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#30FF30", lineWidth: 1 / zoom });
                        ctx.fillStyle = "red";
                        ctx.font = (11 / zoom) + "px Arial";
                        for (let i = 0; i < landmarks.length; i++) {
                            const landmark = landmarks[i];
                            const canvasX = x + landmark.x * drawWidth;
                            const canvasY = y + landmark.y * drawHeight;
                            ctx.fillText(i, canvasX, canvasY);
                        }
                        break;
                    case "eyes":
                        drawingUtils.drawConnectors(scaledLandmarks, FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, { color: "#30FF30", lineWidth: 3 / zoom });
                        drawingUtils.drawConnectors(scaledLandmarks, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE, { color: "#30FF30", lineWidth: 3 / zoom });
                        break;
                    case "nose":
                        drawingUtils.drawConnectors(scaledLandmarks, toFP(NOSE_B), { color: "#000", lineWidth: 1 / zoom });
                        drawingUtils.drawConnectors(scaledLandmarks, toFP(NOSE_BV), { color: "#000", lineWidth: 1 / zoom });
                        drawingUtils.drawConnectors(scaledLandmarks, toFP(NOSE_O), { color: "#000", lineWidth: 1 / zoom });
                         drawingUtils.drawConnectors(scaledLandmarks, toFP(NOSE_OV), { color: "#000", lineWidth: 1 / zoom });
                        break;
                    case "lips":
                        drawingUtils.drawConnectors(scaledLandmarks, FaceLandmarker.FACE_LANDMARKS_LIPS, { color: "#30FF30", lineWidth: 3 / zoom });
                        break;
                    case "marks":
                        drawingUtils.drawConnectors(scaledLandmarks, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#30FF30", lineWidth: 1 / zoom });
                        break;
                    case "lines":
                       drawingUtils.drawConnectors(scaledLandmarks, toFP(FACE_VERTICAL), { color: "#30FF30", lineWidth: 2 / zoom });
                       drawingUtils.drawConnectors(scaledLandmarks, toFP(EYES_HORIZONTAL), { color: "#30FF30", lineWidth: 2 / zoom });
                       drawingUtils.drawConnectors(scaledLandmarks, toFP(NOSE_BASE), { color: "#30FF30", lineWidth: 2 / zoom });
                       drawingUtils.drawConnectors(scaledLandmarks, toFP(LIP_BASE), { color: "#30FF30", lineWidth: 2 / zoom });
                       drawingUtils.drawConnectors(scaledLandmarks, FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, { color: "#30FF30" });
                        break;

                    default:
                        drawingUtils.drawConnectors(scaledLandmarks, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#30FF30", lineWidth: 1 / zoom });
                        break;

                }
            }
            ctx.restore();
        }

        async function handleClear(event) {

            const allCanvas = document.getElementsByClassName("canvas");
            for (var i = allCanvas.length - 1; i >= 0; i--) {
                const n = allCanvas[i];
                n.parentNode.removeChild(n);
            }
        }
   
        ["click"].forEach(eventName => {
            grid.addEventListener(eventName, drawMask, false);
            eyes.addEventListener(eventName, drawMask, false);
            nose.addEventListener(eventName, drawMask, false);
            lips.addEventListener(eventName, drawMask, false);
            marks.addEventListener(eventName, drawMask, false);
            lines.addEventListener(eventName, drawMask, false);
            clear.addEventListener(eventName, handleClear, false);
        });

        const toggleButton = document.getElementById('toggle-image');
        toggleButton.addEventListener('click', () => {
            const displayImage = document.getElementById('display-image');
            displayImage.style.display = 'block'; // Show the image

            displayImage.onload = () => {
                handleClear(null);
                drawMask({ currentTarget: { id: 'grid' } });
            }

            if (displayImage.src.includes('front.jpg')) {
                displayImage.src = 'side.jpg?' + new Date().getTime();
            } else {
                displayImage.src = 'front.jpg?' + new Date().getTime();
            }
        });

        dropArea.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            zoom *= delta;
            drawMask({ currentTarget: { id: lastMaskType } });
        });

        dropArea.addEventListener('mousedown', (e) => {
            isPanning = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        dropArea.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            panX += dx;
            panY += dy;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            drawMask({ currentTarget: { id: lastMaskType } });
        });

        dropArea.addEventListener('mouseup', () => {
            isPanning = false;
        });

    </script>

</body>

</html>
