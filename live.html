<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Face Mesh</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            position: relative;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #555;
        }
        button.active {
            background-color: #30FF30;
            color: black;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas class="canvas" id="output_canvas"></canvas>
    </div>

    <div id="controls">
        <button id="grid">Grid</button>
        <button id="eyes">Eyes</button>
        <button id="lines">Lines</button>
        <button id="box">Box</button>
        <button id="toggle-numbers">Numbers</button>
    </div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

        // Face landmark indices for guide lines
        const FACE_VERTICAL = [10,151,9,8,168,6,197,195,5,4,1,19,164,0,11,12,13,14,15,16,17,18,200,199,175,152];
        const EYES_HORIZONTAL = [127,34,143,35,226,130,33,468,469,155,243,244,245,122,6,351,465,464,463,476,473,474,263,359,446,265,372,356];
        const NOSE_BASE = [203,98,97,2,328,327,423];
        const LIP_BASE = [57,61,76,62,78,95,88,178,87,14,317,402,318,324,308, 292,291,287];

        function toFP(arr){
            var fp = [];
            for(var i=0;i<arr.length-1;i++){
                fp[i] = {"start":arr[i],"end":arr[i+1]};
            }
            return fp;
        }

        let faceLandmarker;
        let areNumbersVisible = false;
        let visualizationMode = 'grid'; // default mode: grid, eyes, lines, box, or null

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");

        // Button controls
        const gridButton = document.getElementById("grid");
        const eyesButton = document.getElementById("eyes");
        const linesButton = document.getElementById("lines");
        const boxButton = document.getElementById("box");
        const toggleNumbersButton = document.getElementById("toggle-numbers");

        function setActiveButton(activeBtn) {
            [gridButton, eyesButton, linesButton, boxButton].forEach(btn => btn.classList.remove('active'));
            if (activeBtn) activeBtn.classList.add('active');
        }

        gridButton.addEventListener("click", () => {
            visualizationMode = visualizationMode === 'grid' ? null : 'grid';
            setActiveButton(visualizationMode === 'grid' ? gridButton : null);
        });

        eyesButton.addEventListener("click", () => {
            visualizationMode = visualizationMode === 'eyes' ? null : 'eyes';
            setActiveButton(visualizationMode === 'eyes' ? eyesButton : null);
        });

        linesButton.addEventListener("click", () => {
            visualizationMode = visualizationMode === 'lines' ? null : 'lines';
            setActiveButton(visualizationMode === 'lines' ? linesButton : null);
        });

        boxButton.addEventListener("click", () => {
            visualizationMode = visualizationMode === 'box' ? null : 'box';
            setActiveButton(visualizationMode === 'box' ? boxButton : null);
        });

        toggleNumbersButton.addEventListener("click", () => {
            areNumbersVisible = !areNumbersVisible;
            toggleNumbersButton.classList.toggle('active');
        });

        // Set grid as active by default
        setActiveButton(gridButton);

        async function createFaceLandmarker() {
            const filesetResolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task`,
                    delegate: "GPU"
                },
                outputFaceBlendshapes: false,
                runningMode: "VIDEO",
                numFaces: 1
            });
            enableCam();
        }
        createFaceLandmarker();

        function enableCam(event) {
            if (!faceLandmarker) {
                console.log("Wait! objectDetector not loaded yet.");
                return;
            }

            // getUsermedia parameters.
            const constraints = {
                video: true
            };

            // Activate the webcam stream.
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            });
        }

        let lastVideoTime = -1;
        let results = undefined;
        const canvasCtx = canvasElement.getContext("2d");
        const drawingUtils = new DrawingUtils(canvasCtx);

        function predictWebcam() {
            // Set canvas to match video dimensions
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;

            canvasElement.width = videoWidth;
            canvasElement.height = videoHeight;

            // Calculate displayed size maintaining aspect ratio
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const videoAspect = videoWidth / videoHeight;
            const containerAspect = containerWidth / containerHeight;

            let displayWidth, displayHeight;
            if (containerAspect > videoAspect) {
                displayHeight = containerHeight;
                displayWidth = displayHeight * videoAspect;
            } else {
                displayWidth = containerWidth;
                displayHeight = displayWidth / videoAspect;
            }

            canvasElement.style.width = displayWidth + 'px';
            canvasElement.style.height = displayHeight + 'px';


            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                results = faceLandmarker.detectForVideo(video, startTimeMs);
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            if (results.faceLandmarks) {
                for (const landmarks of results.faceLandmarks) {
                    // Draw visualization based on selected mode
                    switch (visualizationMode) {
                        case 'grid':
                            drawingUtils.drawConnectors(
                                landmarks,
                                FaceLandmarker.FACE_LANDMARKS_TESSELATION,
                                { color: "#30FF30", lineWidth: 1 }
                            );
                            break;
                        case 'eyes':
                            drawingUtils.drawConnectors(
                                landmarks,
                                FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,
                                { color: "#30FF30", lineWidth: 3 }
                            );
                            drawingUtils.drawConnectors(
                                landmarks,
                                FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,
                                { color: "#30FF30", lineWidth: 3 }
                            );
                            break;
                        case 'lines':
                            drawingUtils.drawConnectors(landmarks, toFP(FACE_VERTICAL), { color: "#30FF30", lineWidth: 2 });
                            drawingUtils.drawConnectors(landmarks, toFP(EYES_HORIZONTAL), { color: "#30FF30", lineWidth: 2 });
                            drawingUtils.drawConnectors(landmarks, toFP(NOSE_BASE), { color: "#30FF30", lineWidth: 2 });
                            drawingUtils.drawConnectors(landmarks, toFP(LIP_BASE), { color: "#30FF30", lineWidth: 2 });
                            drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, { color: "#30FF30" });
                            break;
                        case 'box':
                            // Draw bounding box around face
                            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                            for (const landmark of landmarks) {
                                const x = landmark.x * canvasElement.width;
                                const y = landmark.y * canvasElement.height;
                                minX = Math.min(minX, x);
                                minY = Math.min(minY, y);
                                maxX = Math.max(maxX, x);
                                maxY = Math.max(maxY, y);
                            }
                            canvasCtx.strokeStyle = "#30FF30";
                            canvasCtx.lineWidth = 2;
                            canvasCtx.strokeRect(minX, minY, maxX - minX, maxY - minY);
                            break;
                    }

                    if (areNumbersVisible) {
                        canvasCtx.fillStyle = "red";
                        canvasCtx.font = "10px Arial";
                        let i = 0;
                        for (const landmark of landmarks) {
                            const x = landmark.x * canvasElement.width;
                            const y = landmark.y * canvasElement.height;

                            canvasCtx.save();
                            canvasCtx.translate(x, y);
                            canvasCtx.scale(-1, 1);
                            canvasCtx.fillText(i, 0, 0);
                            canvasCtx.restore();
                            i++;
                        }
                    }
                }
            }
            canvasCtx.restore();

            // Call this function again to keep predicting when the browser is ready.
            window.requestAnimationFrame(predictWebcam);
        }


    </script>
</body>
</html>
