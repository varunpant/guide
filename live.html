<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Face Mesh</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }
        .videoView {
            position: relative;
        }
        video {
            display: none;
        }
        .canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="videoView">
        <video id="webcam" autoplay playsinline></video>
        <canvas class="canvas" id="output_canvas"></canvas>
    </div>
    <div id="controls">
        <button id="toggle-grid">Toggle Grid</button>
        <button id="screenshot">Screenshot</button>
    </div>

    <script type="module">
        import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
        const { FaceLandmarker, FilesetResolver, DrawingUtils } = vision;

        let faceLandmarker;
        let runningMode = "VIDEO";
        let enableWebcamButton;
        let webcamRunning = false;
        let isGridVisible = true;
        let takeScreenshot = false;

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");

        async function createFaceLandmarker() {
            const filesetResolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                outputFaceBlendshapes: true, // Aligning with the example
                runningMode,
                numFaces: 1
            });
            enableCam();
        }
        createFaceLandmarker();

        function enableCam(event) {
            if (!faceLandmarker) {
                console.log("Wait! objectDetector not loaded yet.");
                return;
            }

            webcamRunning = true;

            const constraints = {
                video: true
            };

            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            });
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            const videoView = document.querySelector('.videoView');
            videoView.style.width = video.videoWidth + 'px';
            videoView.style.height = video.videoHeight + 'px';

            canvasElement.style.width = video.videoWidth + 'px';
            canvasElement.style.height = video.videoHeight + 'px';
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);

            if (runningMode === "VIDEO") {
                if (lastVideoTime !== video.currentTime) {
                    lastVideoTime = video.currentTime;
                    const results = faceLandmarker.detectForVideo(video, Date.now());
                    if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                        if (isGridVisible) {
                            const drawingUtils = new DrawingUtils(canvasCtx);
                            for (const landmarks of results.faceLandmarks) {
                                drawingUtils.drawConnectors(
                                    landmarks,
                                    FaceLandmarker.FACE_LANDMARKS_TESSELATION,
                                    { color: "#30FF30" ,lineWidth:0.8}
                                );
                            }
                        }
                    }
                }
            }
            if (takeScreenshot) {
                const dataURL = canvasElement.toDataURL("image/png");
                const link = document.createElement("a");
                link.href = dataURL;
                link.download = "screenshot.png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                takeScreenshot = false;
            }

            canvasCtx.restore();

            if (webcamRunning === true) {
                window.requestAnimationFrame(predictWebcam);
            }
        }

        const toggleGridButton = document.getElementById("toggle-grid");
        toggleGridButton.addEventListener("click", () => {
            isGridVisible = !isGridVisible;
        });

        const screenshotButton = document.getElementById("screenshot");
        screenshotButton.addEventListener("click", () => {
            takeScreenshot = true;
        });

    </script>
</body>
</html>
